name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend – namestitev odvisnosti
        working-directory: backend
        run: npm ci

      - name: Backend – ESLint
        working-directory: backend
        run: npm run lint

      - name: Frontend – namestitev odvisnosti
        working-directory: frontend
        run: npm ci

      - name: Frontend – ESLint
        working-directory: frontend
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:3001' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Cache gradnje Next.js
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**') }}
          restore-keys: |
            nextjs-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Backend – namestitev odvisnosti
        working-directory: backend
        run: npm ci

      - name: Backend – gradnja
        working-directory: backend
        run: npm run build

      - name: Frontend – namestitev odvisnosti
        working-directory: frontend
        run: npm ci

      - name: Frontend – gradnja
        working-directory: frontend
        run: npm run build

      - name: Frontend – priprava paketa
        run: |
          mkdir -p frontend-dist/.next
          cp -r frontend/.next/standalone/. frontend-dist/
          cp -r frontend/.next/static frontend-dist/.next/static

      - name: Shrani artefakt backenda
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: |
            backend/dist
            backend/prisma
            backend/package.json
            backend/package-lock.json
            backend/prisma.config.ts
          if-no-files-found: error

      - name: Shrani artefakt frontenda
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend-dist
          include-hidden-files: true
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: librarium
          POSTGRES_PASSWORD: librarium
          POSTGRES_DB: librarium_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U librarium -d librarium_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://librarium:librarium@localhost:5432/librarium_test?schema=librarium
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend – namestitev odvisnosti
        working-directory: backend
        run: npm ci

      - name: Backend – enotni testi s pokritostjo
        working-directory: backend
        run: npm run test:cov

      - name: Backend – e2e testi
        working-directory: backend
        run: npm run test:e2e

      - name: Frontend – namestitev odvisnosti
        working-directory: frontend
        run: npm ci

      - name: Frontend – testi s pokritostjo
        working-directory: frontend
        run: npm run test:cov

      - name: Shrani poročilo o pokritosti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            backend/coverage
            frontend/coverage
          if-no-files-found: warn

  deploy:
    needs: [lint, build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.FRONTEND_URL }}
    permissions:
      contents: read
      packages: write
    env:
      RENDER_DEPLOY_HOOK_BACKEND: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
      RENDER_DEPLOY_HOOK_FRONTEND: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
    steps:
      - name: Prenesi Dockerfile.deploy
        uses: actions/checkout@v4

      - name: Prenesi artefakt backenda
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: backend-build

      - name: Prenesi artefakt frontenda
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend-build

      - name: Imena slik
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "BACKEND_IMAGE=ghcr.io/${owner}/rirs-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${owner}/rirs-frontend" >> "$GITHUB_ENV"

      - name: Prijava v GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Zapakiraj in objavi sliko backenda
        run: |
          docker build -f backend/Dockerfile.deploy -t "$BACKEND_IMAGE:$GITHUB_SHA" -t "$BACKEND_IMAGE:latest" backend-build
          docker push --all-tags "$BACKEND_IMAGE"

      - name: Zapakiraj in objavi sliko frontenda
        run: |
          docker build -f frontend/Dockerfile.deploy -t "$FRONTEND_IMAGE:$GITHUB_SHA" -t "$FRONTEND_IMAGE:latest" frontend-build
          docker push --all-tags "$FRONTEND_IMAGE"

      - name: Namesti backend na Render
        if: env.RENDER_DEPLOY_HOOK_BACKEND != ''
        run: |
          img=$(jq -rn --arg v "$BACKEND_IMAGE:$GITHUB_SHA" '$v|@uri')
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_BACKEND}&imgURL=${img}"

      - name: Namesti frontend na Render
        if: env.RENDER_DEPLOY_HOOK_FRONTEND != ''
        run: |
          img=$(jq -rn --arg v "$FRONTEND_IMAGE:$GITHUB_SHA" '$v|@uri')
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_FRONTEND}&imgURL=${img}"