name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Backend – namestitev odvisnosti
        working-directory: backend
        run: npm ci

      - name: Backend – ESLint
        working-directory: backend
        run: npm run lint